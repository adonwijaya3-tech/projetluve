<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuVenXe Store | Admin Dashboard</title>
    <meta name="theme-color" content="#020617">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(2, 6, 23, 0.9); border: 1px solid rgba(51, 65, 85, 0.9); color: #fff; }
        .tab-btn.active { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); color: #020617; font-weight: 700; box-shadow: 0 0 15px rgba(6,182,212,0.4); }
        html { scroll-behavior: smooth; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #67e8f9; outline-offset: 3px; }
        .glass-panel { transition: border-color .2s ease, box-shadow .2s ease; }
        .glass-panel:hover { border-color: rgba(56, 189, 248, .38); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 lg:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <!-- LOGIN PANEL ADMIN -->
    <div id="admin-auth-container" class="max-w-md mx-auto mt-20 glass-panel p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="inline-flex p-4 bg-cyan-500/10 border border-cyan-400/30 rounded-2xl text-cyan-400 mb-3 text-3xl"><i class="fa-solid fa-shield-halved"></i></div>
            <h1 class="cyber-font text-2xl font-black text-cyan-400">LUVENXE ADMIN PRO</h1>
            <p class="text-xs text-slate-400 mt-1">Portal Eksklusif Executive Owner</p>
        </div>
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div><label class="block text-xs text-slate-300 mb-1 font-semibold">Email Owner</label><input type="email" id="admin-email" required value="owner@luvenxe.id" class="w-full glass-input rounded-xl px-4 py-3 text-sm"></div>
            <div><label class="block text-xs text-slate-300 mb-1 font-semibold">Password</label><input type="password" id="admin-password" required value="owner123" class="w-full glass-input rounded-xl px-4 py-3 text-sm"></div>
            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black rounded-xl cyber-font text-xs shadow-lg">MASUK DASHBOARD</button>
            <div class="flex justify-between items-center mt-4">
                <a href="index.html" class="text-xs text-cyan-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Toko</a>
                <button type="button" onclick="emergencyReset()" class="text-xs text-red-400 hover:underline bg-red-500/10 px-2 py-1 rounded-lg border border-red-500/20">Reset Sistem (Fix Error)</button>
            </div>
        </form>
    </div>

    <!-- DASHBOARD PANEL UTAMA -->
    <div id="admin-dashboard-panel" class="hidden max-w-7xl mx-auto space-y-6">
        <div class="glass-panel p-6 rounded-2xl flex justify-between items-center">
            <div><h1 class="cyber-font text-lg font-bold text-cyan-400">EXECUTIVE CONTROL CENTER</h1><p class="text-xs text-slate-400">Pusat kendali operasional, produk, payment, banner, dan webhook testimoni.</p></div>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="px-4 py-2 bg-slate-800 text-cyan-400 text-xs font-semibold rounded-xl border border-slate-700">Buka Toko</a>
                <button onclick="adminLogout()" class="px-4 py-2 bg-red-500/10 text-red-400 text-xs font-semibold rounded-xl border border-red-500/30">Keluar</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="glass-panel p-5 rounded-2xl"><h3 class="text-xs text-slate-400 uppercase">Omset Sukses</h3><p id="stat-revenue" class="cyber-font text-2xl font-black text-emerald-400 mt-2">Rp 0</p></div>
            <div class="glass-panel p-5 rounded-2xl"><h3 class="text-xs text-slate-400 uppercase">Pesanan Pending</h3><p id="stat-pending" class="cyber-font text-2xl font-black text-amber-400 mt-2">0</p></div>
            <div class="glass-panel p-5 rounded-2xl"><h3 class="text-xs text-slate-400 uppercase">Pesanan Sukses</h3><p id="stat-acc" class="cyber-font text-2xl font-black text-cyan-400 mt-2">0</p></div>
            <div class="glass-panel p-5 rounded-2xl"><h3 class="text-xs text-slate-400 uppercase">Status Web</h3><p id="stat-status" class="cyber-font text-xl font-bold text-cyan-400 mt-2">ONLINE 🟢</p></div>
        </div>

        <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
            <button onclick="switchAdminTab('orders')" id="btn-tab-orders" class="tab-btn active px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">Transaksi Masuk</button>
            <button onclick="switchAdminTab('stock')" id="btn-tab-stock" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">Kelola Produk</button>
            <button onclick="switchAdminTab('payment')" id="btn-tab-payment" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">Payment & QRIS</button>
            <button onclick="switchAdminTab('banners')" id="btn-tab-banners" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">3 Multi-Banner Home</button>
            <button onclick="switchAdminTab('livechat')" id="btn-tab-livechat" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">Live Chat CS</button>
            <button onclick="switchAdminTab('settings')" id="btn-tab-settings" class="tab-btn px-4 py-2.5 text-xs font-semibold rounded-xl bg-slate-900">Setting Kontak & Webhook</button>
        </div>

        <div id="admin-tab-content" class="glass-panel p-6 rounded-2xl min-h-[400px]"></div>
    </div>

    <script>
        function checkAdminSession() {
            try {
                const user = JSON.parse(localStorage.getItem('luvenxe_current_user') || 'null');
                if (user && user.role && user.role.includes('JURAGAN')) {
                    document.getElementById('admin-auth-container').classList.add('hidden');
                    document.getElementById('admin-dashboard-panel').classList.remove('hidden');
                    loadAdminStats();
                    switchAdminTab('orders');
                } else {
                    document.getElementById('admin-auth-container').classList.remove('hidden');
                    document.getElementById('admin-dashboard-panel').classList.add('hidden');
                }
            } catch (err) {
                localStorage.clear();
                document.getElementById('admin-auth-container').classList.remove('hidden');
                document.getElementById('admin-dashboard-panel').classList.add('hidden');
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();
            if (email === 'owner@luvenxe.id' && pass === 'owner123') {
                localStorage.setItem('luvenxe_current_user', JSON.stringify({ name: 'Executive Owner', email, role: 'JURAGAN / SULTAN' }));
                checkAdminSession();
            } else { 
                alert('Email atau Password Admin Salah!'); 
            }
        }

        function adminLogout() { 
            localStorage.removeItem('luvenxe_current_user'); 
            checkAdminSession(); 
        }

        function emergencyReset() {
            if(confirm('Reset sistem akan membersihkan cache browser yang error. Lanjutkan?')) {
                localStorage.removeItem('luvenxe_current_user');
                alert('Sesi lokal dibersihkan. Data toko dan pesanan tidak dihapus.');
                location.reload();
            }
        }

        function loadAdminStats() {
            const orders = JSON.parse(localStorage.getItem('luvenxe_orders') || '[]');
            document.getElementById('stat-pending').innerText = orders.filter(o => o.status === 'PENDING').length;
            document.getElementById('stat-acc').innerText = orders.filter(o => o.status === 'ACC' || o.status === 'SUKSES').length;
            document.getElementById('stat-revenue').innerText = `Rp ${orders.filter(o => o.status === 'ACC' || o.status === 'SUKSES').reduce((a, b) => a + b.total, 0).toLocaleString('id-ID')}`;
            document.getElementById('stat-status').innerText = (localStorage.getItem('luvenxe_web_status') || 'ONLINE') === 'ONLINE' ? 'ONLINE 🟢' : 'MAINTENANCE 🟠';
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-tab-${tab}`).classList.add('active');
            const container = document.getElementById('admin-tab-content');
            
            if (tab === 'orders') {
                const orders = JSON.parse(localStorage.getItem('luvenxe_orders') || '[]');
                container.innerHTML = `<h3 class="font-bold mb-4 text-cyan-400">Daftar Transaksi Masuk Pelanggan</h3>` + (orders.length === 0 ? '<p class="text-xs text-slate-500">Belum ada pesanan masuk.</p>' : orders.slice().reverse().map(o => `
                    <div class="bg-slate-900 p-4 rounded-xl mb-3 flex justify-between items-center border border-slate-800">
                        <div>
                            <p class="text-xs font-bold text-white">#${o.id} - ${o.productName} (@${o.robloxUser})</p>
                            <p class="text-xs text-emerald-400 font-bold mt-1">Rp ${o.total.toLocaleString()} - Via ${o.paymentMethod}</p>
                            <p class="text-[10px] text-slate-400 mt-0.5">WhatsApp: ${o.whatsapp} | Note: ${o.note||'-'}</p>
                        </div>
                        ${o.status === 'PENDING' ? `
                        <div class="flex gap-2">
                            <button onclick="accOrder('${o.id}')" class="px-3.5 py-2 bg-emerald-600 text-xs font-bold rounded-lg text-white">ACC & Kirim Testi Webhook</button>
                            <button onclick="tolakOrder('${o.id}')" class="px-3.5 py-2 bg-red-600 text-xs font-bold rounded-lg text-white">Tolak</button>
                        </div>` : `<span class="px-3 py-1 rounded-lg text-xs font-bold ${o.status==='ACC'||o.status==='SUKSES'?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}">${o.status}</span>`}
                    </div>`).join(''));
            } else if (tab === 'stock') {
                const products = JSON.parse(localStorage.getItem('luvenxe_products') || '[]');
                container.innerHTML = `
                    <h3 class="font-bold mb-4 text-cyan-400">Tambah Produk Baru</h3>
                    <div class="flex flex-wrap gap-2 mb-6">
                        <input type="text" id="np-name" placeholder="Nama Produk" class="glass-input rounded-xl px-3 py-2 text-xs">
                        <input type="number" id="np-price" placeholder="Harga (Rp)" class="glass-input rounded-xl px-3 py-2 text-xs">
                        <select id="np-cat" class="glass-input rounded-xl px-3 py-2 text-xs">
                            <option value="ROBUX VIA USERNAME">ROBUX VIA USERNAME</option>
                            <option value="ROBUX VIA LOGIN">ROBUX VIA LOGIN</option>
                            <option value="GAMEPASS / ITEM">GAMEPASS / ITEM</option>
                        </select>
                        <button onclick="addProd()" class="bg-cyan-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Tambah Produk</button>
                    </div>
                    <h3 class="font-bold mb-4 text-cyan-400">Daftar Produk Aktif</h3>
                    ` + (products.length === 0 ? '<p class="text-xs text-slate-500">Belum ada produk.</p>' : products.map((p, i) => `
                        <div class="bg-slate-900 p-4 rounded-xl mb-3 flex justify-between items-center border border-slate-800">
                            <div><p class="text-xs font-bold text-white">${p.name} (${p.category})</p><p class="text-xs text-emerald-400">Rp ${p.price.toLocaleString()}</p></div>
                            <button onclick="deleteProd(${i})" class="text-red-400 text-xs font-bold px-3 py-1 bg-red-500/10 rounded-lg">Hapus</button>
                        </div>`).join(''));
            } else if (tab === 'payment') {
                const payments = JSON.parse(localStorage.getItem('luvenxe_payments') || '[{"id":"qris","name":"QRIS Otomatis","active":true,"fee":0,"info":"Bebas Biaya Admin","qrisImage":""}]');
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-cyan-400">Pengaturan Metode Pembayaran (Payment)</h3>
                        <button onclick="addPaymentMethodPrompt()" class="px-3 py-1.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl">+ Tambah Metode</button>
                    </div>
                    <div class="space-y-3">
                        ${payments.map((pm, idx) => `
                            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-sm font-bold text-white">${pm.name}</span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${pm.active?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}">${pm.active?'AKTIF':'NONAKTIF'}</span>
                                    </div>
                                    <p class="text-xs text-slate-400 mt-1">Info: ${pm.info} | Biaya Admin: Rp ${pm.fee}</p>
                                </div>
                                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                                    ${pm.id.toLowerCase().includes('qris') ? `
                                        <div class="w-12 h-12 bg-white rounded-lg p-1">${pm.qrisImage ? `<img src="${pm.qrisImage}" class="w-full h-full object-contain">` : 'No QR'}</div>
                                        <input type="file" accept="image/*" onchange="uploadQrisImage(event, ${idx})" class="text-[10px] text-slate-300 w-36">
                                    ` : ''}
                                    <button onclick="togglePaymentStatus(${idx})" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-lg text-cyan-400 border border-slate-700">${pm.active?'Matikan':'Aktifkan'}</button>
                                    <button onclick="deletePaymentMethod(${idx})" class="px-3 py-1.5 bg-red-500/10 text-xs font-bold rounded-lg text-red-400">Hapus</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (tab === 'banners') {
                const banners = JSON.parse(localStorage.getItem('luvenxe_banners') || '[]');
                container.innerHTML = `
                    <h3 class="font-bold mb-4 text-cyan-400">Kelola 3 Multi-Banner Home</h3>
                    <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3 max-w-lg mb-6">
                        <label class="block text-xs text-slate-300 font-semibold">Upload Gambar Banner Baru:</label>
                        <input type="file" accept="image/*" onchange="uploadMultipleBanner(event)" class="text-xs text-slate-300">
                    </div>
                    <h4 class="text-xs font-bold text-slate-400 mb-3">Daftar Banner Aktif (${banners.length})</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${banners.length === 0 ? '<p class="text-xs text-slate-500">Belum ada banner di-upload.</p>' : banners.map((b, i) => `
                            <div class="relative bg-slate-900 p-2 rounded-xl border border-slate-800 space-y-2">
                                <img src="${b.image}" class="w-full h-32 object-cover rounded-lg">
                                <button onclick="deleteBanner(${i})" class="w-full py-1.5 bg-red-600/20 text-red-400 text-xs font-bold rounded-lg border border-red-500/30">Hapus Banner Ini</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (tab === 'livechat') {
                const chats = JSON.parse(localStorage.getItem('luvenxe_livechats') || '{}');
                const userEmails = Object.keys(chats);
                container.innerHTML = `
                    <h3 class="font-bold mb-4 text-cyan-400">Pusat Live Chat Pelanggan</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="space-y-2 border-r border-slate-800 pr-4">
                            <h4 class="text-xs font-bold text-slate-400 mb-2">Daftar Pelanggan (${userEmails.length})</h4>
                            ${userEmails.length === 0 ? '<p class="text-xs text-slate-500">Belum ada chat masuk.</p>' : userEmails.map(email => `
                                <div onclick="selectAdminChatUser('${email}')" class="p-3 bg-slate-900 rounded-xl cursor-pointer hover:border-cyan-500 border border-slate-800 text-xs">
                                    <div class="font-bold text-white">${email.split('@')[0]}</div>
                                    <div class="text-[10px] text-slate-400 truncate">${email}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="md:col-span-2 space-y-3">
                            <div id="admin-chat-display" class="h-64 overflow-y-auto space-y-2 p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                                <p class="text-slate-500 text-center pt-24">Pilih pelanggan di sebelah kiri untuk membalas pesan.</p>
                            </div>
                            <div id="admin-chat-input-area" class="hidden flex gap-2">
                                <input type="hidden" id="active-chat-email">
                                <input type="text" id="admin-chat-text" placeholder="Balas pesan pelanggan..." class="flex-grow glass-input rounded-xl px-3 py-2 text-xs" onkeypress="if(event.key==='Enter') sendAdminReply()">
                                <button onclick="sendAdminReply()" class="px-4 py-2 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl">Kirim</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 'settings') {
                const settings = JSON.parse(localStorage.getItem('luvenxe_store_settings') || '{"adminWa":"6283177553487","channelUrl":"https://whatsapp.com","webhookUrl":""}');
                const st = localStorage.getItem('luvenxe_web_status') || 'ONLINE';
                container.innerHTML = `
                    <h3 class="font-bold mb-4 text-cyan-400">Pengaturan Kontak & Webhook Testimoni</h3>
                    <div class="space-y-4 max-w-xl">
                        <div><label class="text-xs text-slate-400">Nomor WhatsApp Admin (CS)</label><input type="text" id="set-wa" value="${settings.adminWa}" placeholder="628..." class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs mt-1"></div>
                        <div><label class="text-xs text-slate-400">Link Saluran WhatsApp Resmi</label><input type="text" id="set-channel" value="${settings.channelUrl}" placeholder="https://whatsapp.com/channel/..." class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs mt-1"></div>
                        <div><label class="text-xs text-slate-400">URL Discord Webhook (Otomatis kirim testimoni saat pesanan sukses)</label><input type="text" id="set-webhook" value="${settings.webhookUrl||''}" placeholder="https://discord.com/api/webhooks/..." class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs mt-1"></div>
                        <button onclick="saveStoreSettings()" class="px-4 py-2.5 bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl">Simpan Pengaturan</button>
                        <div class="pt-6 border-t border-slate-800 flex gap-3">
                            <button onclick="setWebStatus('ONLINE')" class="px-4 py-2.5 ${st==='ONLINE'?'bg-emerald-500 text-slate-950':'bg-slate-800 text-white'} text-xs font-bold rounded-xl">SET WEB ONLINE 🟢</button>
                            <button onclick="setWebStatus('MAINTENANCE')" class="px-4 py-2.5 ${st==='MAINTENANCE'?'bg-amber-500 text-slate-950':'bg-slate-800 text-white'} text-xs font-bold rounded-xl">SET WEB MAINTENANCE 🟠</button>
                        </div>
                    </div>
                `;
            }
        }

        function setWebStatus(status) {
            if (!['ONLINE', 'MAINTENANCE'].includes(status)) return;
            localStorage.setItem('luvenxe_web_status', status);
            loadAdminStats();
            switchAdminTab('settings');
            alert(status === 'ONLINE' ? 'Status toko diatur ONLINE.' : 'Status toko diatur MAINTENANCE.');
        }

        function saveStoreSettings() {
            const adminWa = document.getElementById('set-wa').value.trim();
            const channelUrl = document.getElementById('set-channel').value.trim();
            const webhookUrl = document.getElementById('set-webhook').value.trim();
            localStorage.setItem('luvenxe_store_settings', JSON.stringify({ adminWa, channelUrl, webhookUrl }));
            alert('Pengaturan toko berhasil disimpan!');
        }

        function addPaymentMethodPrompt() {
            const name = prompt("Nama Metode Pembayaran (Cth: QRIS, Transfer BCA):");
            if (!name) return;
            const fee = parseInt(prompt("Biaya Admin (Cth: 0 atau 1000):", "0") || "0");
            const info = prompt("Keterangan Pembayaran:", "Scan atau transfer sesuai nominal");
            
            let payments = JSON.parse(localStorage.getItem('luvenxe_payments') || '[]');
            payments.push({ id: 'pay_' + Date.now(), name, active: true, fee, info, qrisImage: '' });
            localStorage.setItem('luvenxe_payments', JSON.stringify(payments));
            switchAdminTab('payment');
            alert('Metode pembayaran berhasil ditambahkan!');
        }

        function togglePaymentStatus(index) {
            let payments = JSON.parse(localStorage.getItem('luvenxe_payments') || '[]');
            payments[index].active = !payments[index].active;
            localStorage.setItem('luvenxe_payments', JSON.stringify(payments));
            switchAdminTab('payment');
        }

        function deletePaymentMethod(index) {
            let payments = JSON.parse(localStorage.getItem('luvenxe_payments') || '[]');
            payments.splice(index, 1);
            localStorage.setItem('luvenxe_payments', JSON.stringify(payments));
            switchAdminTab('payment');
        }

        function uploadQrisImage(e, index) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                let payments = JSON.parse(localStorage.getItem('luvenxe_payments') || '[]');
                payments[index].qrisImage = evt.target.result;
                localStorage.setItem('luvenxe_payments', JSON.stringify(payments));
                alert('QRIS berhasil di-upload!');
                switchAdminTab('payment');
            };
            reader.readAsDataURL(file);
        }

        function uploadMultipleBanner(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                let banners = JSON.parse(localStorage.getItem('luvenxe_banners') || '[]');
                banners.push({ image: evt.target.result });
                localStorage.setItem('luvenxe_banners', JSON.stringify(banners));
                alert('Banner baru berhasil ditambahkan!');
                switchAdminTab('banners');
            };
            reader.readAsDataURL(file);
        }

        function deleteBanner(index) {
            let banners = JSON.parse(localStorage.getItem('luvenxe_banners') || '[]');
            banners.splice(index, 1);
            localStorage.setItem('luvenxe_banners', JSON.stringify(banners));
            switchAdminTab('banners');
            alert('Banner dihapus.');
        }

        function selectAdminChatUser(email) {
            document.getElementById('active-chat-email').value = email;
            document.getElementById('admin-chat-input-area').classList.remove('hidden');
            const chats = JSON.parse(localStorage.getItem('luvenxe_livechats') || '{}');
            const msgs = chats[email] || [];
            const box = document.getElementById('admin-chat-display');
            box.innerHTML = msgs.map(c => `
                <div class="p-2.5 rounded-xl border ${c.sender==='admin'?'ml-auto bg-cyan-950/40 border-cyan-500/30 text-cyan-200':'bg-slate-900 border-slate-800 text-slate-200'}">
                    <span class="text-[9px] ${c.sender==='admin'?'text-cyan-400':'text-amber-400'} font-bold block">${c.sender==='admin'?'Admin':'Pelanggan'}</span>
                    ${c.text}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function sendAdminReply() {
            const email = document.getElementById('active-chat-email').value;
            const input = document.getElementById('admin-chat-text');
            const text = input.value.trim();
            if (!email || !text) return;

            let chats = JSON.parse(localStorage.getItem('luvenxe_livechats') || '{}');
            if (!chats[email]) chats[email] = [];
            chats[email].push({ sender: 'admin', text });
            localStorage.setItem('luvenxe_livechats', JSON.stringify(chats));
            input.value = '';
            selectAdminChatUser(email);
        }

        function accOrder(id) {
            let orders = JSON.parse(localStorage.getItem('luvenxe_orders') || '[]');
            const order = orders.find(o => o.id === id);
            orders = orders.map(o => o.id === id ? { ...o, status: 'ACC' } : o);
            localStorage.setItem('luvenxe_orders', JSON.stringify(orders));
            
            const settings = JSON.parse(localStorage.getItem('luvenxe_store_settings') || '{}');
            if (settings.webhookUrl && order) {
                fetch(settings.webhookUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: `✅ Testimoni Transaksi #${order.id} Sukses!`,
                            color: 65280,
                            description: `Terima kasih telah berbelanja di LuVenXe Store!`,
                            fields: [
                                { name: "Produk", value: order.productName, inline: true },
                                { name: "Roblox User", value: `@${order.robloxUser}`, inline: true },
                                { name: "Total Bayar", value: `Rp ${order.total.toLocaleString('id-ID')}`, inline: true }
                            ]
                        }]
                    })
                }).catch(()=>{});
            }
            loadAdminStats(); switchAdminTab('orders'); alert('Pesanan di-ACC & Testimoni otomatis terkirim ke Discord Webhook!');
        }

        function tolakOrder(id) {
            let orders = JSON.parse(localStorage.getItem('luvenxe_orders') || '[]');
            orders = orders.map(o => o.id === id ? { ...o, status: 'DITOLAK' } : o);
            localStorage.setItem('luvenxe_orders', JSON.stringify(orders));
            loadAdminStats(); switchAdminTab('orders'); alert('Pesanan ditolak.');
        }

        function addProd() {
            const name = document.getElementById('np-name').value;
            const price = parseInt(document.getElementById('np-price').value);
            const cat = document.getElementById('np-cat').value;
            if (!name.trim() || !Number.isFinite(price) || price <= 0) return alert('Masukkan nama produk dan harga yang valid (lebih dari Rp 0).');
            let p = JSON.parse(localStorage.getItem('luvenxe_products') || '[]');
            p.push({ id: Date.now(), name, price, category: cat, stock: 50 });
            localStorage.setItem('luvenxe_products', JSON.stringify(p));
            switchAdminTab('stock'); alert('Produk ditambahkan!');
        }

        function deleteProd(i) {
            let p = JSON.parse(localStorage.getItem('luvenxe_products') || '[]');
            p.splice(i, 1);
            localStorage.setItem('luvenxe_products', JSON.stringify(p));
            switchAdminTab('stock');
        }

        window.addEventListener('DOMContentLoaded', checkAdminSession);
    </script>
</body>
</html>
